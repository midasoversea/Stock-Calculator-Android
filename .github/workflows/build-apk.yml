name: Build Stock Calculator APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Sync web assets and Splash Screen plugin
        run: npx cap sync android
      - name: Apply Stock Calculator launcher and splash assets
        run: |
          mkdir -p android/app/src/main/res/mipmap-anydpi android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/drawable android/app/src/main/res/values
          cp android-icons/mipmap-anydpi/ic_launcher.xml android/app/src/main/res/mipmap-anydpi/ic_launcher.xml
          cp android-icons/mipmap-anydpi/ic_launcher_round.xml android/app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          cp android-icons/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp android-icons/mipmap-anydpi-v26/ic_launcher_round.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cp android-icons/drawable/ic_stock_launcher_foreground.xml android/app/src/main/res/drawable/ic_stock_launcher_foreground.xml
          cp android-icons/drawable/stock_splash.xml android/app/src/main/res/drawable/stock_splash.xml
          cp android-icons/values/stock_icon_colors.xml android/app/src/main/res/values/stock_icon_colors.xml

          # Capacitor's generated Android 11-and-below launch theme still points
          # to its default blue splash drawable. Redirect it to our branded art.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/res/values/styles.xml")
          s = p.read_text()
          old = "@drawable/splash"
          new = "@drawable/stock_splash"
          if old not in s:
              raise SystemExit("Expected default @drawable/splash reference not found in styles.xml")
          p.write_text(s.replace(old, new))
          print("Verified: native launch theme now uses @drawable/stock_splash")
          PY
      - name: Force launcher and Recent Apps task icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest.xml has no <application> element")

          # Explicitly bind both the installed launcher icon and task-switcher icon.
          app.set(ns + "icon", "@mipmap/ic_launcher")
          app.set(ns + "roundIcon", "@mipmap/ic_launcher_round")

          launcher_activities = []
          for activity in app.findall("activity"):
              has_launcher = False
              for intent in activity.findall("intent-filter"):
                  actions = [x.get(ns + "name") for x in intent.findall("action")]
                  categories = [x.get(ns + "name") for x in intent.findall("category")]
                  if "android.intent.action.MAIN" in actions and "android.intent.category.LAUNCHER" in categories:
                      has_launcher = True
                      break
              if has_launcher:
                  activity.set(ns + "icon", "@mipmap/ic_launcher")
                  activity.set(ns + "roundIcon", "@mipmap/ic_launcher_round")
                  launcher_activities.append(activity.get(ns + "name", "(unnamed)"))

          if not launcher_activities:
              raise SystemExit("No MAIN/LAUNCHER activity found; refusing to build with an uncertain task icon")

          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          print("Application icon and launcher activity icon set to Stock Calculator assets.")
          print("Launcher activities:", ", ".join(launcher_activities))
          PY
      - name: Set Recent Apps task icon explicitly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if len(candidates) != 1:
              raise SystemExit(f"Expected exactly one MainActivity.java, found {len(candidates)}")

          path = candidates[0]
          source = path.read_text()
          class_pattern = r"(public class MainActivity extends BridgeActivity\\s*\\{)\\s*\\}"
          match = re.search(class_pattern, source)
          if not match and "setTaskDescription(" not in source:
              raise SystemExit("Unexpected MainActivity structure; refusing an unsafe patch")

          if "setTaskDescription(" not in source:
              imports = """import android.app.ActivityManager;
          import android.graphics.BitmapFactory;
          import android.graphics.Color;
          import android.os.Bundle;
          """
              package_end = source.find("\\n")
              if package_end < 0:
                  raise SystemExit("Could not locate Java package declaration")
              source = source[:package_end + 1] + imports + source[package_end + 1:]

              body = """\\1
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  android.graphics.Bitmap taskIcon = BitmapFactory.decodeResource(
                      getResources(), R.mipmap.ic_launcher
                  );
                  setTaskDescription(new ActivityManager.TaskDescription(
                      "Stock Calculator", taskIcon, Color.rgb(23, 23, 47)
                  ));
              }
          }"""
              source, count = re.subn(class_pattern, body, source, count=1)
              if count != 1:
                  raise SystemExit("Could not safely insert Recent Apps task icon code")
              path.write_text(source)

          print("Recent Apps task description now uses the Stock Calculator launcher icon.")
          PY
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stock-Calculator-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
